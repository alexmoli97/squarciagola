org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Client ID di Spotify usato quando local.properties non ne dichiara uno.
# Sotto PKCE non e' un segreto: identifica l'applicazione, non l'utente, e senza il code
# verifier generato a ogni accesso non permette di ottenere nulla. Sta qui perche' una copia
# appena clonata compili e funzioni senza configurazione, come fa il progetto che usa un
# server proprio per lo stesso scopo.
spotify.clientId=
org.gradle.java.home=/home/amoli/jdk21
